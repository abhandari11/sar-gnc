# Alpstein massif (Appenzell, CH): karst ridges and cliff bands between Saentis and Altmann.
area:
  name: alpstein_meglisalp
  center: {lat: 47.2493, lon: 9.3800}
  size_m: [1400, 1400]      # search rectangle, east x north
  buffer_m: 1300            # DEM margin on every side for turns/orbits
  resolution_m: 5.0
  dem_source: swissalti3d
