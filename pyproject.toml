[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sargnc"
version = "0.1.0"
description = "Terrain-aware GNC for a small flying-wing UAV doing search and rescue in mountains"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "numba>=0.59",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
static = ["kaleido>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
